# ==============================================================================
# Nginx Configuration with Carrier-Grade Micro-Caching for Wi-Fi Captive Portal
# ==============================================================================

# Define in-memory micro-cache zone for high-concurrency captive portal init requests
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=portal_cache:20m inactive=10m max_size=1g;

# Rate limiting zones to prevent DDoS / Brute-force authentication hammering
limit_req_zone $binary_remote_addr zone=portal_auth_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=60r/s;
limit_req_status 429;

# Upstream connection pooling with HTTP Keep-Alive
upstream backend_service {
    server manage-wifi-backend-svc:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Maximum upload size for portal banners, logos, and campaign promotional videos (up to 100MB)
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static assets caching (30 days with immutable caching)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # ĐỀ XUẤT 1: Nginx Micro-Caching cho API Cổng chào (/api/portal/init)
    # Gánh 95% lưu lượng người dân truy cập, phản hồi < 1ms trực tiếp từ RAM
    # --------------------------------------------------------------------------
    location = /api/portal/init {
        proxy_pass http://backend_service/api/portal/init;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình Micro-Cache 5 phút
        proxy_cache portal_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 10s;
        proxy_cache_key "$scheme$request_method$host$request_uri";

        # Chống hiệu ứng dội bom khi cache hết hạn (Cache Stampede / Thundering Herd)
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        # Bỏ qua cache khi Admin hoặc Client gửi header làm mới
        proxy_cache_bypass $http_cache_control;
        proxy_no_cache $http_pragma;

        # Trả về header X-Cache-Status để kiểm tra HIT / MISS
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Portal-Cached "Nginx-MicroCache-v1" always;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Rate-limited Guest Login endpoint (protects SMS OTP gateway and DB auth)
    location = /api/portal/login {
        limit_req zone=portal_auth_limit burst=25 nodelay;
        proxy_pass http://backend_service/api/portal/login;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        add_header X-Cache-Status "BYPASS" always;
    }

    # Reverse proxy for Backend REST APIs (Admin, Surveys - Không cache để đảm bảo an toàn)
    location /api/ {
        limit_req zone=api_general_limit burst=50 nodelay;
        proxy_pass http://backend_service/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        add_header X-Cache-Status "BYPASS" always;
    }

    # High-Performance Zero-Copy Static File & Media Delivery (Offloads Tomcat)
    # Check local uploads volume mount first with OS zero-copy sendfile, fallback to backend if file is in MinIO
    location /uploads/ {
        root /var/www;
        try_files $uri @backend_uploads;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-Ranges bytes;
    }

    # Fallback to backend for dynamic streaming or MinIO proxy
    location @backend_uploads {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Fast Captive Portal OS Probe Redirects (iOS Captive Network Assistant, Android CaptivePortalLogin, Windows NCSI)
    # Immediately redirect captive probe paths to /portal so iPhone CNA popup opens without double-loading index.html
    location ~ ^/(hotspot-detect\.html|library/test/success\.html|generate_204|gen_204|connectivitycheck/generate_204|ncsi\.txt|connecttest\.txt)$ {
        return 302 /portal$is_args$args;
    }

    # Single Page Application routing (Citizen Portal & Admin Dashboard)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
